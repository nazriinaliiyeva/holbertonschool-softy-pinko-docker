version: '3.8'

services:
  back-end:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    image: softy-pinko-back-end:task4
    ports:
      - "5252:5252"     # host:container
    container_name: task4-back-end
    networks:
      - softy

  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    image: softy-pinko-front-end:task4
    ports:
      - "8080:80"        # host:container (Nginx)
    container_name: task4-front-end
    depends_on:
      - back-end
    networks:
      - softy

networks:
  softy:
    driver: bridge

